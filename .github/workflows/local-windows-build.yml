name: Personal Windows build

on:
  push:
    branches:
      - mijun/local-build
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'mjaow/t3code'
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      T3CODE_TELEMETRY_CHANNEL: dev
      T3CODE_DISABLE_AUTO_UPDATE: 'true'
    steps:
      - name: Checkout source
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --no-recurse-submodules --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 -c submodule.recurse=false checkout --detach FETCH_HEAD

      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Verify packaging regression and fix
        shell: pwsh
        run: |
          $source = 'scripts/build-desktop-artifact.ts'
          $fixed = [IO.File]::ReadAllBytes($source)
          try {
            git fetch --no-tags --no-recurse-submodules --depth=1 origin 589416fff07ad2668417c0a919786f2e32d362bd
            if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the regression baseline.' }
            git show 589416fff07ad2668417c0a919786f2e32d362bd:$source | Set-Content $source -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw 'Could not load the regression baseline.' }
            vp test run scripts/build-desktop-artifact.test.ts -t 'unpacks target Windows natives'
            if ($LASTEXITCODE -eq 0) { throw 'The regression must fail before the fix.' }
          } finally {
            [IO.File]::WriteAllBytes($source, $fixed)
          }
          vp test run scripts/build-desktop-artifact.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          vp fmt --check scripts/build-desktop-artifact.ts scripts/build-desktop-artifact.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows desktop archive
        shell: pwsh
        run: >-
          vp run dist:desktop:artifact
          --platform win --target zip --arch x64
          --build-version "0.1.9-local.${{ github.run_number }}"
          --output-dir artifacts --verbose

      - name: Record source revision and hashes
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem artifacts -File -Filter '*.zip')
          if ($archives.Count -ne 1) { throw 'Expected one Windows archive.' }
          '${{ github.sha }}' | Set-Content artifacts/source-commit.txt
          $archives |
            Get-FileHash -Algorithm SHA256 |
            Select-Object @{n='File';e={Split-Path $_.Path -Leaf}}, Hash |
            ConvertTo-Json | Set-Content artifacts/checksums.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: t3-personal-windows-${{ github.sha }}
          path: |
            artifacts/*.zip
            artifacts/source-commit.txt
            artifacts/checksums.json
          if-no-files-found: error
          retention-days: 7
