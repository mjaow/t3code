name: Personal Windows build

on:
  push:
    branches:
      - mijun/local-build
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'mjaow/t3code'
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      T3CODE_TELEMETRY_CHANNEL: dev
      T3CODE_DISABLE_AUTO_UPDATE: "true"
    steps:
      - name: Checkout source
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --no-recurse-submodules --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 -c submodule.recurse=false checkout --detach FETCH_HEAD

      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts... --filter=@t3tools/oxlint-plugin-t3code...

      - name: Verify speed regression baseline and changed-file checks
        shell: pwsh
        run: |
          $baseline = 'd7798c0c620e1035f4159c5b8927cacefe174eb9'
          git fetch --no-tags --no-recurse-submodules --depth=1 origin $baseline
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the speed regression baseline.' }
          $files = @('packages/shared/src/model.ts', 'packages/client-runtime/src/modelTraits.ts')
          $fixed = @{}
          foreach ($file in $files) { $fixed[$file] = [IO.File]::ReadAllBytes((Join-Path $PWD $file)) }
          try {
            foreach ($file in $files) {
              git show "${baseline}:$file" | Set-Content $file -Encoding utf8
              if ($LASTEXITCODE -ne 0) { throw "Could not load baseline $file." }
            }
            $report = Join-Path $env:RUNNER_TEMP 'speed-regression.json'
            Push-Location packages/client-runtime
            vp test run src/modelTraits.test.ts -t 'uses the backend' --reporter=json --outputFile=$report
            if ($LASTEXITCODE -eq 0) { throw 'The speed regressions must fail before the fix.' }
            if ((Get-Content $report -Raw | ConvertFrom-Json).numFailedTests -ne 2) {
              throw 'Expected both backend speed regressions to fail.'
            }
          } finally {
            Set-Location $env:GITHUB_WORKSPACE
            foreach ($file in $files) { [IO.File]::WriteAllBytes((Join-Path $PWD $file), $fixed[$file]) }
          }
          $claudeBaseline = '552fe1dae3f93f837bf92ca0065e402887a3ab0b'
          git fetch --no-tags --no-recurse-submodules --depth=1 origin $claudeBaseline
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the Claude Fast probe baseline.' }
          $claudeSource = Join-Path $PWD 'apps/server/src/provider/ClaudeProvider.ts'
          $claudeFixed = [IO.File]::ReadAllBytes($claudeSource)
          try {
            git show "${claudeBaseline}:apps/server/src/provider/ClaudeProvider.ts" | Set-Content $claudeSource -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw 'Could not load the Claude Fast probe baseline.' }
            $report = Join-Path $env:RUNNER_TEMP 'claude-fast-probe-regression.json'
            Push-Location apps/server
            vp test run src/provider/ClaudeCapabilitiesProbe.test.ts -t 'Fast disabled' --reporter=json --outputFile=$report
            if ($LASTEXITCODE -eq 0) { throw 'The Claude Fast opt-in regression must fail before the fix.' }
            if ((Get-Content $report -Raw | ConvertFrom-Json).numFailedTests -ne 1) {
              throw 'Expected only the accepted Fast opt-in case to fail.'
            }
          } finally {
            Set-Location $env:GITHUB_WORKSPACE
            [IO.File]::WriteAllBytes($claudeSource, $claudeFixed)
          }
          $changed = @(git diff --name-only $baseline HEAD)
          vp fmt --check @changed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sourceFiles = @($changed | Where-Object { $_ -match '\.tsx?$' })
          vp lint --report-unused-disable-directives @sourceFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify provider speed regressions
        shell: pwsh
        run: |
          Push-Location packages/client-runtime
          vp test run src/modelTraits.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location packages/shared
          vp test run --config ../../vite.config.ts src/model.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location apps/server
          vp test run src/provider/CodexProvider.test.ts src/provider/ClaudeModelCatalog.test.ts src/provider/ClaudeCapabilitiesProbe.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          vp test run src/provider/ProviderRegistry.test.ts -t 'unverified speed|reviving unverified|app-server account and model list'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          vp test run src/orchestration-v2/Adapters/CodexAdapterV2.test.ts src/orchestration-v2/Adapters/ClaudeAdapterV2.test.ts -t 'reports backend speed'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Check provider speed types
        shell: pwsh
        run: |
          vp run --filter t3 --filter @t3tools/shared --filter @t3tools/client-runtime typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify packaging regression and fix
        shell: pwsh
        working-directory: scripts
        run: |
          $source = Join-Path $PWD 'build-desktop-artifact.ts'
          $fixed = [IO.File]::ReadAllBytes($source)
          try {
            git fetch --no-tags --no-recurse-submodules --depth=1 origin 589416fff07ad2668417c0a919786f2e32d362bd
            if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the regression baseline.' }
            git show 589416fff07ad2668417c0a919786f2e32d362bd:scripts/build-desktop-artifact.ts | Set-Content $source -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw 'Could not load the regression baseline.' }
            $report = Join-Path $env:RUNNER_TEMP 'packaging-regression.json'
            vp test run --config ../vite.config.ts build-desktop-artifact.test.ts -t 'unpacks target Windows natives' --reporter=json --outputFile=$report
            if ($LASTEXITCODE -eq 0) { throw 'The regression must fail before the fix.' }
            if ((Get-Content $report -Raw | ConvertFrom-Json).numFailedTests -ne 1) {
              throw 'Expected one failing regression assertion.'
            }
          } finally {
            [IO.File]::WriteAllBytes($source, $fixed)
          }
          vp test run --config ../vite.config.ts build-desktop-artifact.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          vp fmt --check build-desktop-artifact.ts build-desktop-artifact.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows desktop archive
        shell: pwsh
        run: >-
          vp run dist:desktop:artifact
          --platform win --target zip --arch x64
          --build-version "0.1.9-local.${{ github.run_number }}"
          --output-dir artifacts --verbose

      - name: Record source revision and hashes
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem artifacts -File -Filter '*.zip')
          if ($archives.Count -ne 1) { throw 'Expected one Windows archive.' }
          '${{ github.sha }}' | Set-Content artifacts/source-commit.txt
          $archives |
            Get-FileHash -Algorithm SHA256 |
            Select-Object @{n='File';e={Split-Path $_.Path -Leaf}}, Hash |
            ConvertTo-Json | Set-Content artifacts/checksums.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: t3-personal-windows-${{ github.sha }}
          path: |
            artifacts/*.zip
            artifacts/source-commit.txt
            artifacts/checksums.json
          if-no-files-found: error
          retention-days: 7
